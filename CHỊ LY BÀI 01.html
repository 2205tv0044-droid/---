<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入境登机牌 · Ôn tập Tiếng Trung Giao Tiếp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+SC:wght@500;700;900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E2;
    --paper-2:#EFE6CE;
    --paper-3:#E8DCBE;
    --ink:#1E2D3B;
    --ink-soft:#51637A;
    --ink-faint:#8A97A6;
    --stamp:#A23B2C;
    --stamp-dark:#7E2E22;
    --gold:#A2812F;
    --gold-soft:#C9A94A;
    --line:#D3C39C;
    --ok:#3E6B4F;
    --bad:#A23B2C;
    --radius:14px;
    --shadow: 0 1px 0 rgba(30,45,59,.05), 0 8px 24px -12px rgba(30,45,59,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 10% -10%, #fffaf0 0%, transparent 60%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Be Vietnam Pro', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .hidden{display:none !important;}
  .hanzi{font-family:'Noto Serif SC', serif;}
  .display{font-family:'Playfair Display', serif;}
  .mono{font-family:'JetBrains Mono', monospace;}

  #app{
    position:relative;
    max-width:980px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  /* ============ HEADER ============ */
  .masthead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding-bottom:20px;
    border-bottom:2px solid var(--ink);
    margin-bottom:22px;
    position:relative;
  }
  .masthead .id{display:flex;align-items:center;gap:14px;}
  .seal-mark{
    width:52px;height:52px;
    border-radius:50%;
    border:2px solid var(--stamp);
    display:flex;align-items:center;justify-content:center;
    color:var(--stamp);
    font-family:'Noto Serif SC',serif;
    font-weight:900;
    font-size:22px;
    transform:rotate(-8deg);
    flex:none;
    position:relative;
  }
  .seal-mark::after{content:"";position:absolute;inset:5px;border:1px solid var(--stamp);border-radius:50%;}
  .masthead h1{margin:0;font-size:26px;letter-spacing:.3px;line-height:1.15;}
  .masthead .sub{margin:2px 0 0;color:var(--ink-soft);font-size:13px;letter-spacing:.5px;text-transform:uppercase;}
  .masthead .doc-no{text-align:right;color:var(--ink-faint);font-size:11px;letter-spacing:1px;text-transform:uppercase;line-height:1.8;}
  .masthead .doc-no b{color:var(--ink-soft);}

  /* ============ NAV ============ */
  .nav-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .nav-link{
    background:none;border:1px solid var(--line);
    padding:8px 16px;border-radius:20px;
    font-size:12.5px;font-weight:700;color:var(--ink-soft);
    cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;
    display:inline-flex;align-items:center;gap:6px;
  }
  .nav-link.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .nav-link .badge{background:var(--stamp);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;}

  .mistake-banner{
    background:#F3E3DD;border:1px solid var(--stamp);border-radius:10px;
    padding:12px 18px;display:flex;justify-content:space-between;align-items:center;
    margin-bottom:20px;font-size:13px;color:var(--stamp-dark);gap:12px;flex-wrap:wrap;
  }

  /* ============ HOME: topic grid ============ */
  .home-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
  .home-hero h2{font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-soft);margin:0 0 4px;}
  .home-hero p{margin:0;color:var(--ink-faint);font-size:13px;max-width:440px;}
  .global-btn{
    background:var(--ink);color:var(--paper);border:none;padding:13px 22px;border-radius:8px;
    font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:14px;cursor:pointer;
    display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);transition:transform .15s ease;
  }
  .global-btn:hover{transform:translateY(-2px);}
  .global-btn svg{width:16px;height:16px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(255px,1fr));gap:18px;}

  .pass{
    position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
    cursor:pointer;overflow:hidden;box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease;display:flex;min-height:128px;
  }
  .pass:hover{transform:translateY(-3px);}
  .pass .stub{
    flex:none;width:64px;background:var(--ink);color:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
    -webkit-mask-image: radial-gradient(circle 5px at 64px 0, transparent 5px, black 5px);
  }
  .pass .stub .num{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;}
  .pass .stub .num-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft);margin-top:2px;}
  .perf{position:absolute;left:64px;top:0;bottom:0;width:0;border-left:2px dashed rgba(30,45,59,.25);}
  .pass .body{flex:1;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;}
  .pass .body .title{font-size:14.5px;font-weight:600;line-height:1.35;color:var(--ink);}
  .pass .body .meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;}
  .pass .body .meta .count{font-size:11px;color:var(--ink-faint);letter-spacing:.3px;}
  .pass .body .barcode{
    height:18px;width:70px;
    background:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px);
    opacity:.55;
  }

  /* ============ TOPIC VIEW ============ */
  .back-btn{
    background:none;border:none;color:var(--ink-soft);font-family:'Be Vietnam Pro',sans-serif;
    font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;
    margin-bottom:16px;padding:6px 0;
  }
  .back-btn:hover{color:var(--ink);}

  .topic-head{display:flex;align-items:center;gap:16px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line);}
  .topic-head .seal-mark{width:58px;height:58px;font-size:24px;}
  .topic-head h2{margin:0;font-size:22px;}

  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:2px solid var(--ink);flex-wrap:wrap;}
  .tab{
    background:none;border:none;font-family:'Be Vietnam Pro',sans-serif;font-weight:700;
    font-size:13.5px;letter-spacing:.3px;color:var(--ink-faint);padding:10px 16px;cursor:pointer;
    position:relative;top:2px;
  }
  .tab.active{color:var(--ink);border-bottom:2px solid var(--stamp);}

  /* ---- speaker button ---- */
  .spk-btn{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);
    flex:none;
  }
  .spk-btn:hover{border-color:var(--stamp);color:var(--stamp);}
  .spk-btn svg{width:14px;height:14px;}

  /* ---- flashcards ---- */
  .flash-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(190px,1fr));gap:16px;}
  .flashcard{perspective:1000px;height:150px;cursor:pointer;}
  .flashcard .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;}
  .flashcard.flipped .inner{transform:rotateY(180deg);}
  .flashcard .face{
    position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;
  }
  .flashcard .front{background:var(--paper-2);box-shadow:var(--shadow);}
  .flashcard.known .front{border-color:var(--ok);box-shadow:0 0 0 2px rgba(62,107,79,.25), var(--shadow);}
  .flashcard .front .hz{font-size:32px;font-weight:700;color:var(--ink);}
  .flashcard .front .py{margin-top:6px;color:var(--stamp);font-size:13px;font-weight:600;}
  .flashcard .back{background:var(--ink);color:var(--paper);transform:rotateY(180deg);}
  .flashcard .back .mn{font-size:15px;font-weight:600;line-height:1.4;}
  .flashcard .hint{position:absolute;bottom:8px;right:10px;font-size:9px;color:var(--ink-faint);letter-spacing:.5px;text-transform:uppercase;}
  .flash-know-btn{
    margin-top:12px;background:rgba(246,241,226,.12);border:1px solid rgba(246,241,226,.4);
    color:var(--paper);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;
    cursor:pointer;letter-spacing:.3px;font-family:'Be Vietnam Pro',sans-serif;
  }
  .flash-know-btn.on{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--ink);}

  /* ---- grammar ---- */
  .grammar-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
  .structure-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grammar-card .structure{font-family:'Noto Serif SC',serif;font-size:24px;font-weight:700;color:var(--ink);}
  .grammar-card .py-row{margin-top:6px;color:var(--stamp);font-weight:600;font-size:14px;font-family:'JetBrains Mono',monospace;}
  .grammar-card .meaning{margin-top:10px;color:var(--ink-soft);font-size:14px;padding-top:10px;border-top:1px dashed var(--line);}
  .note-box{
    background:#F3E9DC;border-left:3px solid var(--gold);border-radius:0 10px 10px 0;
    padding:14px 18px;margin-bottom:16px;font-size:13.5px;color:var(--ink-soft);line-height:1.6;position:relative;
  }
  .note-box .lbl{display:block;font-weight:800;color:var(--gold);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;}

  /* ---- examples ---- */
  .example-row{display:flex;align-items:center;gap:16px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:10px;}
  .example-row .idx{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);flex:none;width:26px;}
  .example-row .content{flex:1;min-width:0;}
  .zh-row{display:flex;align-items:center;gap:8px;}
  .example-row .zh{font-family:'Noto Serif SC',serif;font-size:17px;color:var(--ink);}
  .example-row .py{font-size:12.5px;color:var(--stamp);margin-top:3px;font-family:'JetBrains Mono',monospace;}
  .example-row .vi{font-size:13px;color:var(--ink-soft);margin-top:4px;}

  /* ============ QUIZ SETUP ============ */
  .setup-wrap{max-width:640px;margin:0 auto;}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  .cat-card{background:var(--paper-2);border:1.5px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;transition:all .15s;}
  .cat-card:hover{border-color:var(--stamp);transform:translateY(-2px);}
  .cat-card .cat-title{font-weight:800;font-size:15px;color:var(--ink);}
  .cat-card .cat-desc{font-size:12px;color:var(--ink-faint);margin-top:4px;}
  .cat-card.mistake{background:#F3E3DD;border-color:var(--stamp);margin-top:14px;display:flex;align-items:center;}
  .cat-card.mistake .cat-title{color:var(--stamp);}

  /* ============ QUIZ ============ */
  .quiz-wrap{max-width:640px;margin:0 auto;}
  .quiz-tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;font-weight:700;}
  .quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .quiz-progress .bar{flex:1;height:6px;background:var(--paper-3);border-radius:4px;overflow:hidden;}
  .quiz-progress .bar .fill{height:100%;background:var(--stamp);border-radius:4px;transition:width .3s ease;}
  .quiz-progress .count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);flex:none;}
  .quiz-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:34px 30px;box-shadow:var(--shadow);text-align:center;}
  .quiz-card .q-lbl{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:14px;}
  .quiz-card .q-main{font-family:'Noto Serif SC',serif;font-size:34px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .quiz-card .q-sub{font-size:14px;color:var(--stamp);font-family:'JetBrains Mono',monospace;margin-bottom:4px;}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px;}
  .opt{
    background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:14px 12px;
    font-family:'Be Vietnam Pro',sans-serif;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s ease;
  }
  .opt.zh{font-family:'Noto Serif SC',serif;font-size:18px;}
  .opt:hover{border-color:var(--ink-soft);}
  .opt.correct{background:rgba(62,107,79,.15);border-color:var(--ok);color:var(--ok);}
  .opt.wrong{background:rgba(162,59,44,.15);border-color:var(--bad);color:var(--bad);}
  .opt.disabled{pointer-events:none;}
  .opt.dim{opacity:.45;}

  .quiz-next{
    margin-top:22px;background:var(--ink);color:var(--paper);border:none;padding:12px 28px;border-radius:8px;
    font-family:'Be Vietnam Pro',sans-serif;font-weight:700;font-size:14px;cursor:pointer;
    opacity:0;transform:translateY(6px);transition:all .25s ease;pointer-events:none;
  }
  .quiz-next.show{opacity:1;transform:none;pointer-events:auto;}

  .result-wrap{text-align:center;padding:40px 20px;position:relative;}
  .result-score{font-family:'Playfair Display',serif;font-size:20px;color:var(--ink-soft);margin-bottom:26px;}
  .stamp-seal{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:180px;height:180px;
    border-radius:50%;border:5px solid var(--stamp);color:var(--stamp);position:relative;
    transform:rotate(-10deg) scale(.7);opacity:0;animation:stampIn .5s cubic-bezier(.34,1.56,.64,1) .15s forwards;
  }
  .stamp-seal::before{content:"";position:absolute;inset:10px;border:1.5px solid var(--stamp);border-radius:50%;}
  .stamp-seal .big{font-family:'Noto Serif SC',serif;font-weight:900;font-size:30px;}
  .stamp-seal .small{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:6px;font-weight:700;}
  @keyframes stampIn{0%{opacity:0;transform:rotate(-10deg) scale(1.4);}60%{opacity:1;}100%{opacity:1;transform:rotate(-10deg) scale(1);}}
  .redo-btn{display:block;margin:16px auto 0;background:var(--ink);color:var(--paper);border:none;padding:12px 26px;border-radius:8px;font-weight:700;font-family:'Be Vietnam Pro',sans-serif;cursor:pointer;}

  /* ============ DASHBOARD ============ */
  .dash-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:26px;}
  .dash-summary-card{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-align:center;}
  .dash-summary-card .num{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--ink);}
  .dash-summary-card .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);margin-top:4px;}
  .dash-table{width:100%;border-collapse:collapse;}
  .dash-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);padding:8px 10px;border-bottom:2px solid var(--ink);}
  .dash-table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px;}
  .dash-table tr:hover{background:rgba(0,0,0,.02);}
  .mini-bar{width:100%;height:6px;background:var(--paper-3);border-radius:4px;overflow:hidden;min-width:60px;}
  .mini-bar .fill{height:100%;border-radius:4px;}
  .dash-topic-name{font-weight:700;cursor:pointer;}
  .dash-topic-name:hover{color:var(--stamp);}
  .weak-tag{background:rgba(162,59,44,.12);color:var(--stamp);font-size:9px;font-weight:800;padding:2px 6px;border-radius:10px;letter-spacing:.4px;margin-left:6px;white-space:nowrap;}

  footer.foot{text-align:center;margin-top:50px;color:var(--ink-faint);font-size:11px;letter-spacing:1px;text-transform:uppercase;}

  @media (max-width:520px){
    .masthead{flex-wrap:wrap;}
    .masthead .doc-no{display:none;}
    .options{grid-template-columns:1fr;}
    .cat-grid{grid-template-columns:1fr;}
    .quiz-card{padding:26px 18px;}
    .quiz-card .q-main{font-size:28px;}
    .dash-table{font-size:11px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const TOPICS = JSON.parse(document.getElementById('topic-data').textContent);

/* ---------------- PROGRESS / PERSISTENCE ---------------- */
function loadProgress(){
  let data = {};
  try{
    const raw = localStorage.getItem('ontap_zh_v1');
    if(raw) data = JSON.parse(raw);
  }catch(e){}
  if(!data.stats) data.stats = {};
  if(!data.mistakes) data.mistakes = {};
  return data;
}
let PROGRESS = loadProgress();
function saveProgress(){
  try{ localStorage.setItem('ontap_zh_v1', JSON.stringify(PROGRESS)); }catch(e){}
}
function vKey(topicId,hanzi){ return 'v:'+topicId+':'+hanzi; }
function eKey(topicId,zh){ return 'e:'+topicId+':'+zh; }
function gKey(topicId,structure){ return 'g:'+topicId+':'+structure; }
function getStat(key){ return PROGRESS.stats[key] || (PROGRESS.stats[key] = {correct:0,wrong:0,known:false}); }
function isMastered(key){
  const s = PROGRESS.stats[key];
  if(!s) return false;
  return !!s.known || (s.correct > s.wrong && s.correct > 0);
}
function recordAnswer(key, isCorrect, kind, topicId, ref){
  const s = getStat(key);
  if(isCorrect){ s.correct++; delete PROGRESS.mistakes[key]; }
  else { s.wrong++; PROGRESS.mistakes[key] = {kind, topicId, ref}; }
  saveProgress();
}
function toggleKnown(key){
  const s = getStat(key);
  s.known = !s.known;
  if(s.known) delete PROGRESS.mistakes[key];
  saveProgress();
}
function mistakeCount(){ return Object.keys(PROGRESS.mistakes).length; }

/* ---------------- TEXT TO SPEECH ---------------- */
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function spkBtn(text){
  const b = document.createElement('button');
  b.className = 'spk-btn';
  b.type = 'button';
  b.title = 'Nghe phát âm';
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 9v6h4l5 5V4L9 9H5z"/><path d="M16.5 12c0-1.6-.9-3-2.2-3.7v7.4c1.3-.7 2.2-2.1 2.2-3.7z"/><path d="M18.5 12c0-2.7-1.5-5-3.7-6.2v1.7c1.5 1 2.4 2.7 2.4 4.5s-.9 3.5-2.4 4.5v1.7c2.2-1.2 3.7-3.5 3.7-6.2z"/></svg>';
  b.onclick = function(e){ e.stopPropagation(); speak(text); };
  return b;
}

/* ---------------- STATE ---------------- */
let state = { view:'home', topicId:null, tab:'vocab', setupTopicId:null, quiz:null };

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pick(arr,n){ return shuffle(arr).slice(0,n); }
function getTopic(id){ return TOPICS.find(t=>t.id===id); }

/* ---------------- QUIZ ENGINE ---------------- */
function questionRef(q){
  if(q.type==='sentence') return q.q.zh;
  if(q.type==='g2m') return q.q.structure;
  return q.q.hanzi;
}

function buildQuestionPool(topicIds, category){
  const inSet = id => topicIds.includes(id);
  const vocabSel=[], exampleSel=[], grammarSel=[];
  const vocabAll=[], exampleAll=[], grammarAll=[];
  TOPICS.forEach(t=>{
    t.vocab.forEach(v=>{ const item={...v, topicId:t.id}; vocabAll.push(item); if(inSet(t.id)) vocabSel.push(item); });
    t.examples.forEach(e=>{ const item={...e, topicId:t.id}; exampleAll.push(item); if(inSet(t.id)) exampleSel.push(item); });
    t.grammar.forEach(g=>{ const item={...g, topicId:t.id}; grammarAll.push(item); if(inSet(t.id)) grammarSel.push(item); });
  });
  const questions = [];

  if(category==='all' || category==='vocab'){
    vocabSel.forEach(v=>{
      const key = vKey(v.topicId, v.hanzi);
      const dA = pick(vocabAll.filter(x=>x.meaning!==v.meaning),3).map(x=>x.meaning);
      if(dA.length===3) questions.push({type:'h2m', kind:'vocab', key, q:v, correct:v.meaning, options:shuffle([v.meaning,...dA])});
      const dB = pick(vocabAll.filter(x=>x.hanzi!==v.hanzi),3).map(x=>x.hanzi+'||'+x.pinyin);
      if(dB.length===3) questions.push({type:'m2h', kind:'vocab', key, q:v, correct:v.hanzi+'||'+v.pinyin, options:shuffle([v.hanzi+'||'+v.pinyin,...dB])});
    });
  }
  if(category==='all' || category==='sentence'){
    exampleSel.forEach(e=>{
      const key = eKey(e.topicId, e.zh);
      const d = pick(exampleAll.filter(x=>x.vi!==e.vi),3).map(x=>x.zh+'||'+x.pinyin);
      if(d.length===3) questions.push({type:'sentence', kind:'example', key, q:e, correct:e.zh+'||'+e.pinyin, options:shuffle([e.zh+'||'+e.pinyin,...d])});
    });
  }
  if(category==='all' || category==='grammar'){
    grammarSel.forEach(g=>{
      const key = gKey(g.topicId, g.structure);
      const d = pick(grammarAll.filter(x=>x.meaning!==g.meaning),3).map(x=>x.meaning);
      if(d.length===3) questions.push({type:'g2m', kind:'grammar', key, q:g, correct:g.meaning, options:shuffle([g.meaning,...d])});
    });
  }
  return shuffle(questions);
}

function buildMistakeQuestions(topicId){
  const entries = Object.entries(PROGRESS.mistakes).filter(([k,v]) => !topicId || v.topicId===topicId);
  const vocabAll=[], exampleAll=[], grammarAll=[];
  TOPICS.forEach(t=>{
    t.vocab.forEach(v=>vocabAll.push({...v, topicId:t.id}));
    t.examples.forEach(e=>exampleAll.push({...e, topicId:t.id}));
    t.grammar.forEach(g=>grammarAll.push({...g, topicId:t.id}));
  });
  const questions = [];
  entries.forEach(([key, meta])=>{
    if(meta.kind==='vocab'){
      const v = vocabAll.find(x=>x.topicId===meta.topicId && x.hanzi===meta.ref);
      if(!v) return;
      if(Math.random()<0.5){
        const dA = pick(vocabAll.filter(x=>x.meaning!==v.meaning),3).map(x=>x.meaning);
        if(dA.length===3) questions.push({type:'h2m', kind:'vocab', key, q:v, correct:v.meaning, options:shuffle([v.meaning,...dA])});
      } else {
        const dB = pick(vocabAll.filter(x=>x.hanzi!==v.hanzi),3).map(x=>x.hanzi+'||'+x.pinyin);
        if(dB.length===3) questions.push({type:'m2h', kind:'vocab', key, q:v, correct:v.hanzi+'||'+v.pinyin, options:shuffle([v.hanzi+'||'+v.pinyin,...dB])});
      }
    } else if(meta.kind==='example'){
      const e = exampleAll.find(x=>x.topicId===meta.topicId && x.zh===meta.ref);
      if(!e) return;
      const d = pick(exampleAll.filter(x=>x.vi!==e.vi),3).map(x=>x.zh+'||'+x.pinyin);
      if(d.length===3) questions.push({type:'sentence', kind:'example', key, q:e, correct:e.zh+'||'+e.pinyin, options:shuffle([e.zh+'||'+e.pinyin,...d])});
    } else if(meta.kind==='grammar'){
      const g = grammarAll.find(x=>x.topicId===meta.topicId && x.structure===meta.ref);
      if(!g) return;
      const d = pick(grammarAll.filter(x=>x.meaning!==g.meaning),3).map(x=>x.meaning);
      if(d.length===3) questions.push({type:'g2m', kind:'grammar', key, q:g, correct:g.meaning, options:shuffle([g.meaning,...d])});
    }
  });
  return shuffle(questions);
}

function startQuiz(topicId, category){
  let questions;
  if(category==='mistakes'){
    questions = buildMistakeQuestions(topicId);
  } else {
    const ids = topicId ? [topicId] : TOPICS.map(t=>t.id);
    questions = buildQuestionPool(ids, category);
  }
  const count = category==='mistakes' ? questions.length : Math.min(15, questions.length);
  state.quiz = { topicId, category, questions: questions.slice(0,count), idx:0, score:0, answered:false };
  state.view = 'quiz';
  render();
}

function answerQuiz(chosen, q, optDivs, chosenDiv){
  if(state.quiz.answered) return;
  state.quiz.answered = true;
  const isRight = chosen === q.correct;
  if(isRight) state.quiz.score++;
  recordAnswer(q.key, isRight, q.kind, q.q.topicId, questionRef(q));
  optDivs.forEach(d=>{
    d.classList.add('disabled');
    const val = d.dataset.val;
    if(val===q.correct) d.classList.add('correct');
    else if(d===chosenDiv) d.classList.add('wrong');
    else d.classList.add('dim');
  });
  const spkReveal = document.getElementById('quiz-speak-btn');
  if(spkReveal) spkReveal.classList.remove('hidden');
  document.getElementById('quiz-next-btn').classList.add('show');
}

function nextQuiz(){
  state.quiz.idx++;
  state.quiz.answered = false;
  if(state.quiz.idx >= state.quiz.questions.length) state.view = 'quiz-result';
  render();
}

/* ---------------- DASHBOARD STATS ---------------- */
function computeTopicStats(t){
  const vocabTotal = t.vocab.length;
  const vocabMastered = t.vocab.filter(v=>isMastered(vKey(t.id,v.hanzi))).length;
  const grammarTotal = t.grammar.length;
  const grammarMastered = t.grammar.filter(g=>isMastered(gKey(t.id,g.structure))).length;
  const exampleTotal = t.examples.length;
  const exampleMastered = t.examples.filter(e=>isMastered(eKey(t.id,e.zh))).length;
  const allKeys = [
    ...t.vocab.map(v=>vKey(t.id,v.hanzi)),
    ...t.grammar.map(g=>gKey(t.id,g.structure)),
    ...t.examples.map(e=>eKey(t.id,e.zh))
  ];
  const attempted = allKeys.some(k=>{ const s=PROGRESS.stats[k]; return s && (s.correct>0 || s.wrong>0 || s.known); });
  return {
    vocab:{total:vocabTotal, mastered:vocabMastered, pct: vocabTotal? Math.round(vocabMastered/vocabTotal*100):0},
    grammar:{total:grammarTotal, mastered:grammarMastered, pct: grammarTotal? Math.round(grammarMastered/grammarTotal*100):0},
    example:{total:exampleTotal, mastered:exampleMastered, pct: exampleTotal? Math.round(exampleMastered/exampleTotal*100):0},
    attempted
  };
}

/* ---------------- RENDER HELPERS ---------------- */
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}
function renderNav(active){
  const nav = el('div','nav-row');
  const homeBtn = el('button','nav-link'+(active==='home'?' active':''), 'Danh mục chủ đề');
  homeBtn.onclick = ()=>{ state.view='home'; render(); };
  const dashBtn = el('button','nav-link'+(active==='dashboard'?' active':''), '📊 Tổng quan tiến độ');
  dashBtn.onclick = ()=>{ state.view='dashboard'; render(); };
  nav.appendChild(homeBtn); nav.appendChild(dashBtn);
  return nav;
}

/* ---------------- MAIN RENDER ---------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderMasthead());

  if(state.view==='home') app.appendChild(renderHome());
  else if(state.view==='dashboard') app.appendChild(renderDashboard());
  else if(state.view==='topic') app.appendChild(renderTopic());
  else if(state.view==='quiz-setup') app.appendChild(renderQuizSetup());
  else if(state.view==='quiz') app.appendChild(renderQuiz());
  else if(state.view==='quiz-result') app.appendChild(renderQuizResult());

  const foot = document.createElement('footer');
  foot.className='foot';
  foot.textContent = 'Giáo trình Tổng hợp Tiếng Trung Giao Tiếp · Biên soạn: Nguyễn Thanh Thường · Tiến độ được lưu trên trình duyệt này';
  app.appendChild(foot);
}

function renderMasthead(){
  const wrap = el('div','masthead');
  wrap.innerHTML = `
    <div class="id">
      <div class="seal-mark">入</div>
      <div>
        <h1 class="display">Ôn tập Tiếng Trung Giao Tiếp</h1>
        <p class="sub">Thủ tục nhập cảnh · Công việc · Thời gian · Du lịch · Ngữ pháp</p>
      </div>
    </div>
    <div class="doc-no">GIÁO TRÌNH SỐ <b>01</b><br>13 CHỦ ĐỀ · 效期不限</div>
  `;
  return wrap;
}

function renderHome(){
  const wrap = el('div');
  wrap.appendChild(renderNav('home'));

  if(mistakeCount()>0){
    const banner = el('div','mistake-banner');
    banner.innerHTML = `<span>🔴 Bạn có <b>${mistakeCount()}</b> câu từng trả lời sai chưa ôn lại.</span>`;
    const btn = el('button','nav-link', 'Ôn ngay →');
    btn.style.background='var(--stamp)'; btn.style.color='#fff'; btn.style.borderColor='var(--stamp)';
    btn.onclick = ()=>startQuiz(null,'mistakes');
    banner.appendChild(btn);
    wrap.appendChild(banner);
  }

  const hero = el('div','home-hero');
  hero.innerHTML = `
    <div>
      <h2>Danh mục 13 chủ đề</h2>
      <p>Mỗi chủ đề là một "boarding pass" — nhấn để xem từ vựng, ngữ pháp, câu ví dụ và làm trắc nghiệm ôn tập.</p>
    </div>
  `;
  const btn = el('button','global-btn');
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 L14.5 8.5 L21.5 9 L16 13.5 L17.5 20.5 L12 16.5 L6.5 20.5 L8 13.5 L2.5 9 L9.5 8.5 Z"/></svg> Ôn tập tổng hợp`;
  btn.onclick = ()=>{ state.view='quiz-setup'; state.setupTopicId=null; render(); };
  hero.appendChild(btn);
  wrap.appendChild(hero);

  const grid = el('div','grid');
  TOPICS.forEach(t=>{
    const card = el('div','pass');
    card.innerHTML = `
      <div class="stub">
        <div class="num">${String(t.id).padStart(2,'0')}</div>
        <div class="num-lbl">Chủ đề</div>
      </div>
      <div class="perf"></div>
      <div class="body">
        <div class="title">${t.title}</div>
        <div class="meta">
          <div class="count">${t.vocab.length} từ vựng · ${t.examples.length} câu</div>
          <div class="barcode"></div>
        </div>
      </div>
    `;
    card.onclick = ()=>{ state.view='topic'; state.topicId=t.id; state.tab='vocab'; render(); };
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderDashboard(){
  const wrap = el('div');
  wrap.appendChild(renderNav('dashboard'));

  let totalVocab=0, masteredVocab=0, totalGram=0, masteredGram=0, totalEx=0, masteredEx=0;
  const rows = TOPICS.map(t=>{
    const s = computeTopicStats(t);
    totalVocab+=s.vocab.total; masteredVocab+=s.vocab.mastered;
    totalGram+=s.grammar.total; masteredGram+=s.grammar.mastered;
    totalEx+=s.example.total; masteredEx+=s.example.mastered;
    return {t,s};
  });

  const summary = el('div','dash-summary-grid');
  [
    ['Từ vựng đã thuộc', masteredVocab, totalVocab],
    ['Mẫu câu đã thuộc', masteredEx, totalEx],
    ['Ngữ pháp đã thuộc', masteredGram, totalGram],
    ['Câu cần ôn lại', mistakeCount(), null]
  ].forEach(([lbl,val,total])=>{
    const c = el('div','dash-summary-card');
    c.innerHTML = `<div class="num">${val}${total!==null?'<span style="font-size:14px;color:var(--ink-faint);"> / '+total+'</span>':''}</div><div class="lbl">${lbl}</div>`;
    summary.appendChild(c);
  });
  wrap.appendChild(summary);

  function barCell(pct, total){
    if(!total) return '<td>—</td>';
    const color = pct>=70 ? 'var(--ok)' : (pct>=40 ? 'var(--gold)' : 'var(--stamp)');
    return `<td><div class="mini-bar"><div class="fill" style="width:${pct}%;background:${color}"></div></div><div style="font-size:10px;color:var(--ink-faint);margin-top:3px;">${pct}%</div></td>`;
  }

  const tbl = el('table','dash-table');
  tbl.innerHTML = '<thead><tr><th>Chủ đề</th><th>Từ vựng</th><th>Mẫu câu</th><th>Ngữ pháp</th></tr></thead>';
  const tbody = el('tbody');
  rows.forEach(({t,s})=>{
    const weak = s.attempted && (
      (s.vocab.total && s.vocab.pct<50) ||
      (s.example.total && s.example.pct<50) ||
      (s.grammar.total && s.grammar.pct<50)
    );
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><span class="dash-topic-name">${String(t.id).padStart(2,'0')}. ${t.title}</span>${weak?'<span class="weak-tag">CẦN ÔN</span>':''}</td>
      ${barCell(s.vocab.pct, s.vocab.total)}
      ${barCell(s.example.pct, s.example.total)}
      ${barCell(s.grammar.pct, s.grammar.total)}`;
    tr.querySelector('.dash-topic-name').onclick = ()=>{ state.view='topic'; state.topicId=t.id; state.tab='vocab'; render(); };
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  return wrap;
}

function renderTopic(){
  const t = getTopic(state.topicId);
  const wrap = el('div');

  const back = el('button','back-btn','&larr; Quay lại danh mục');
  back.onclick = ()=>{ state.view='home'; render(); };
  wrap.appendChild(back);

  const head = el('div','topic-head');
  head.innerHTML = `
    <div class="seal-mark">${String(t.id).padStart(2,'0')}</div>
    <div><h2 class="display">${t.title}</h2></div>
  `;
  wrap.appendChild(head);

  const tabs = el('div','tabs');
  const tabDefs = [['vocab','Từ vựng'], ['grammar','Ngữ pháp'], ['examples','Câu ví dụ'], ['quiz','🎯 Trắc nghiệm']];
  tabDefs.forEach(([key,label])=>{
    const b = el('button','tab'+(state.tab===key && key!=='quiz' ?' active':''), label);
    b.onclick = ()=>{
      if(key==='quiz'){ state.view='quiz-setup'; state.setupTopicId=t.id; render(); }
      else { state.tab=key; render(); }
    };
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  if(state.tab==='vocab') wrap.appendChild(renderVocab(t));
  else if(state.tab==='grammar') wrap.appendChild(renderGrammar(t));
  else if(state.tab==='examples') wrap.appendChild(renderExamples(t));

  return wrap;
}

function renderVocab(t){
  const grid = el('div','flash-grid');
  t.vocab.forEach(v=>{
    const key = vKey(t.id, v.hanzi);
    const stat = PROGRESS.stats[key];
    const isKnownFlag = !!(stat && stat.known);
    const card = el('div','flashcard'+(isKnownFlag?' known':''));
    card.innerHTML = `
      <div class="inner">
        <div class="face front">
          <div class="hz hanzi">${v.hanzi}</div>
          <div class="py mono">${v.pinyin}</div>
          <div class="hint">Nhấn để xem nghĩa</div>
        </div>
        <div class="face back">
          <div class="mn">${v.meaning}</div>
          <button type="button" class="flash-know-btn${isKnownFlag?' on':''}">${isKnownFlag?'✓ Đã thuộc':'Đánh dấu đã thuộc'}</button>
        </div>
      </div>
    `;
    const spk = spkBtn(v.hanzi);
    spk.style.position='absolute'; spk.style.top='8px'; spk.style.right='8px';
    card.querySelector('.front').appendChild(spk);
    card.onclick = ()=>card.classList.toggle('flipped');
    const knowBtn = card.querySelector('.flash-know-btn');
    knowBtn.onclick = (e)=>{
      e.stopPropagation();
      toggleKnown(key);
      const nowKnown = !!(PROGRESS.stats[key] && PROGRESS.stats[key].known);
      knowBtn.classList.toggle('on', nowKnown);
      knowBtn.textContent = nowKnown ? '✓ Đã thuộc' : 'Đánh dấu đã thuộc';
      card.classList.toggle('known', nowKnown);
    };
    grid.appendChild(card);
  });
  return grid;
}

function renderGrammar(t){
  const wrap = el('div');
  t.notes.forEach(n=>{
    const box = el('div','note-box');
    box.innerHTML = `<span class="lbl">Ghi chú</span>${n}`;
    wrap.appendChild(box);
  });
  t.grammar.forEach(g=>{
    const card = el('div','grammar-card');
    card.innerHTML = `
      <div class="structure-row"><div class="structure hanzi">${g.structure}</div></div>
      <div class="py-row">${g.pinyin}</div>
      <div class="meaning">${g.meaning}</div>
    `;
    card.querySelector('.structure-row').appendChild(spkBtn(g.structure));
    wrap.appendChild(card);
  });
  return wrap;
}

function renderExamples(t){
  const wrap = el('div');
  t.examples.forEach((e,i)=>{
    const row = el('div','example-row');
    row.innerHTML = `
      <div class="idx mono">${String(i+1).padStart(2,'0')}</div>
      <div class="content">
        <div class="zh-row"><div class="zh">${e.zh}</div></div>
        <div class="py">${e.pinyin}</div>
        <div class="vi">${e.vi}</div>
      </div>
    `;
    row.querySelector('.zh-row').appendChild(spkBtn(e.zh));
    wrap.appendChild(row);
  });
  return wrap;
}

function renderQuizSetup(){
  const t = state.setupTopicId ? getTopic(state.setupTopicId) : null;
  const wrap = el('div','setup-wrap');
  const back = el('button','back-btn','&larr; Quay lại');
  back.onclick = ()=>{ state.view = t ? 'topic' : 'home'; render(); };
  wrap.appendChild(back);

  const head = el('div');
  head.innerHTML = `<h2 class="display" style="margin:0 0 4px;">${t ? 'Ôn tập: '+t.title : 'Ôn tập tổng hợp 13 chủ đề'}</h2><p style="color:var(--ink-faint);font-size:13px;margin:0;">Chọn dạng câu hỏi muốn luyện</p>`;
  wrap.appendChild(head);

  const grid = el('div','cat-grid');
  [
    ['all','Tổng quát','Trộn cả từ vựng, mẫu câu, ngữ pháp'],
    ['vocab','Từ vựng','Chữ Hán ⇄ nghĩa tiếng Việt'],
    ['sentence','Mẫu câu','Câu ví dụ ⇄ nghĩa tiếng Việt'],
    ['grammar','Ngữ pháp','Cấu trúc ngữ pháp ⇄ ý nghĩa']
  ].forEach(([key,title,desc])=>{
    const c = el('div','cat-card');
    c.innerHTML = `<div class="cat-title">${title}</div><div class="cat-desc">${desc}</div>`;
    c.onclick = ()=>startQuiz(state.setupTopicId, key);
    grid.appendChild(c);
  });
  wrap.appendChild(grid);

  const scopedMistakes = Object.values(PROGRESS.mistakes).filter(m=>!state.setupTopicId || m.topicId===state.setupTopicId).length;
  if(scopedMistakes>0){
    const m = el('div','cat-card mistake');
    m.innerHTML = `<div><div class="cat-title">🔴 Ôn lại câu sai (${scopedMistakes})</div><div class="cat-desc">Chỉ luyện những câu bạn từng trả lời sai</div></div>`;
    m.onclick = ()=>startQuiz(state.setupTopicId, 'mistakes');
    wrap.appendChild(m);
  }

  return wrap;
}

const CAT_LABEL = {all:'Tổng quát', vocab:'Từ vựng', sentence:'Mẫu câu', grammar:'Ngữ pháp', mistakes:'Ôn lại câu sai'};

function renderQuiz(){
  const wrap = el('div','quiz-wrap');
  const q = state.quiz.questions[state.quiz.idx];

  const back = el('button','back-btn','&larr; Thoát ôn tập');
  back.onclick = ()=>{ state.view = state.quiz.topicId ? 'topic' : 'home'; state.tab='vocab'; render(); };
  wrap.appendChild(back);

  const tag = el('div','quiz-tag', (state.quiz.topicId ? getTopic(state.quiz.topicId).title+' · ' : 'Tổng hợp 13 chủ đề · ') + CAT_LABEL[state.quiz.category]);
  wrap.appendChild(tag);

  const prog = el('div','quiz-progress');
  const pct = Math.round((state.quiz.idx)/state.quiz.questions.length*100);
  prog.innerHTML = `
    <div class="count mono">${state.quiz.idx+1}/${state.quiz.questions.length}</div>
    <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="count mono">✓ ${state.quiz.score}</div>
  `;
  wrap.appendChild(prog);

  const card = el('div','quiz-card');
  let qLabel='', qMainHTML='', optClass='', promptSpeak=null;

  if(q.type==='h2m'){
    qLabel='Chữ này nghĩa là gì?';
    qMainHTML = `<div class="q-main hanzi">${q.q.hanzi}</div><div class="q-sub mono">${q.q.pinyin}</div>`;
    promptSpeak = q.q.hanzi;
  } else if(q.type==='g2m'){
    qLabel='Cấu trúc này dùng để làm gì?';
    qMainHTML = `<div class="q-main hanzi" style="font-size:26px;">${q.q.structure}</div><div class="q-sub mono">${q.q.pinyin}</div>`;
    promptSpeak = q.q.structure;
  } else if(q.type==='m2h'){
    qLabel='Chọn chữ Hán đúng nghĩa sau';
    qMainHTML = `<div class="q-prompt" style="font-size:19px;font-weight:600;color:var(--ink);margin-top:6px;">${q.q.meaning}</div>`;
    optClass='zh';
  } else {
    qLabel='Chọn câu tiếng Trung đúng với nghĩa sau';
    qMainHTML = `<div class="q-prompt" style="font-size:18px;font-weight:600;color:var(--ink);margin-top:6px;">"${q.q.vi}"</div>`;
    optClass='zh';
  }

  card.innerHTML = `<div class="q-lbl">${qLabel}</div>${qMainHTML}`;

  const spk = promptSpeak ? spkBtn(promptSpeak) : spkBtn(q.correct.split('||')[0]);
  spk.style.marginTop='10px';
  if(!promptSpeak){ spk.id='quiz-speak-btn'; spk.classList.add('hidden'); }
  card.appendChild(spk);

  const optWrap = el('div','options');
  card.appendChild(optWrap);
  wrap.appendChild(card);

  const optDivs = [];
  q.options.forEach(opt=>{
    let displayHTML = opt;
    if(q.type==='m2h' || q.type==='sentence'){
      const parts = opt.split('||');
      displayHTML = `<div class="hanzi">${parts[0]}</div><div class="mono" style="font-size:11px;margin-top:4px;color:var(--ink-soft);font-weight:500;">${parts[1]}</div>`;
    }
    const optDiv = el('div','opt'+(optClass?' '+optClass:''), displayHTML);
    optDiv.dataset.val = opt;
    optDiv.onclick = ()=>answerQuiz(opt, q, optDivs, optDiv);
    optDivs.push(optDiv);
    optWrap.appendChild(optDiv);
  });

  const nextBtn = el('button','quiz-next', state.quiz.idx+1>=state.quiz.questions.length ? 'Xem kết quả →' : 'Câu tiếp theo →');
  nextBtn.id='quiz-next-btn';
  nextBtn.onclick = nextQuiz;
  wrap.appendChild(nextBtn);

  return wrap;
}

function renderQuizResult(){
  const wrap = el('div','quiz-wrap');
  const q = state.quiz;
  const pct = q.questions.length ? Math.round(q.score/q.questions.length*100) : 0;
  const pass = pct>=70;

  const result = el('div','result-wrap');
  result.innerHTML = `
    <div class="result-score display">Kết quả: ${q.score} / ${q.questions.length} câu đúng (${pct}%)</div>
    <div class="stamp-seal">
      <div class="big hanzi">${pass?'已通过':'再接再厉'}</div>
      <div class="small">${pass?'Đã hoàn thành':'Cố gắng thêm'}</div>
    </div>
  `;
  wrap.appendChild(result);

  const redo = el('button','redo-btn','Làm lại (cùng dạng)');
  redo.onclick = ()=>startQuiz(q.topicId, q.category);
  wrap.appendChild(redo);

  const scopedMistakes = Object.values(PROGRESS.mistakes).filter(m=>!q.topicId || m.topicId===q.topicId).length;
  if(scopedMistakes>0){
    const redoWrong = el('button','redo-btn','🔴 Ôn lại câu sai ('+scopedMistakes+')');
    redoWrong.style.background='var(--stamp)';
    redoWrong.onclick = ()=>startQuiz(q.topicId,'mistakes');
    wrap.appendChild(redoWrong);
  }

  const back = el('button','back-btn','&larr; Về danh mục chủ đề');
  back.style.display='block'; back.style.margin='16px auto 0';
  back.onclick = ()=>{ state.view='home'; render(); };
  wrap.appendChild(back);

  return wrap;
}

render();
</script>
</body>
</html>
